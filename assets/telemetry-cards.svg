<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="130">
  <defs>
    <style>
      .bg { fill: #09090b; stroke: #27272a; stroke-width: 1; }
      .corner { fill: #52525b; font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 10px; }
      .tag { fill: #00e5ff; font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 9px; letter-spacing: 1.5px; font-weight: 600; }
      .tag-amber { fill: #fbbf24; font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 9px; letter-spacing: 1.5px; font-weight: 600; }
      .tag-emerald { fill: #34d399; font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 9px; letter-spacing: 1.5px; font-weight: 600; }
      .val { fill: #ffffff; font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 28px; font-weight: 700; }
      .label { fill: #e4e4e7; font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; }
      .desc { fill: #a1a1aa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10.5px; }
    </style>
  </defs>

  <!-- Card 1: 92% mAP -->
  <g transform="translate(0, 5)">
    <rect x="2" y="0" width="216" height="118" class="bg" />
    <text x="10" y="14" class="corner">+</text>
    <text x="206" y="14" class="corner">+</text>
    <text x="10" y="112" class="corner">+</text>
    <text x="206" y="112" class="corner">+</text>
    <circle cx="20" cy="26" r="3" fill="#00e5ff" />
    <text x="29" y="29" class="tag">VISION // YOLOv9</text>
    <text x="16" y="64" class="val">92%</text>
    <text x="16" y="84" class="label">mAP AI ACCURACY</text>
    <text x="16" y="101" class="desc">30+ FPS real-time detection</text>
  </g>

  <!-- Card 2: 80% IoT Efficiency -->
  <g transform="translate(226, 5)">
    <rect x="2" y="0" width="216" height="118" class="bg" />
    <text x="10" y="14" class="corner">+</text>
    <text x="206" y="14" class="corner">+</text>
    <text x="10" y="112" class="corner">+</text>
    <text x="206" y="112" class="corner">+</text>
    <circle cx="20" cy="26" r="3" fill="#fbbf24" />
    <text x="29" y="29" class="tag-amber">IEEE // ICORISS 2025</text>
    <text x="16" y="64" class="val">80%</text>
    <text x="16" y="84" class="label">IOT EFFICIENCY GAIN</text>
    <text x="16" y="101" class="desc">Automated ESP32 telemetry</text>
  </g>

  <!-- Card 3: 68.75% Win Rate -->
  <g transform="translate(452, 5)">
    <rect x="2" y="0" width="216" height="118" class="bg" />
    <text x="10" y="14" class="corner">+</text>
    <text x="206" y="14" class="corner">+</text>
    <text x="10" y="112" class="corner">+</text>
    <text x="206" y="112" class="corner">+</text>
    <circle cx="20" cy="26" r="3" fill="#34d399" />
    <text x="29" y="29" class="tag-emerald">ALGO // FINTECH AI</text>
    <text x="16" y="64" class="val">68.75%</text>
    <text x="16" y="84" class="label">ALGORITHMIC WIN RATE</text>
    <text x="16" y="101" class="desc">MLP + Ollama LLM validation</text>
  </g>

  <!-- Card 4: 10X Velocity -->
  <g transform="translate(678, 5)">
    <rect x="2" y="0" width="218" height="118" class="bg" />
    <text x="10" y="14" class="corner">+</text>
    <text x="208" y="14" class="corner">+</text>
    <text x="10" y="112" class="corner">+</text>
    <text x="208" y="112" class="corner">+</text>
    <circle cx="20" cy="26" r="3" fill="#00e5ff" />
    <text x="29" y="29" class="tag">VIBE CODING // AGENTS</text>
    <text x="16" y="64" class="val">10X</text>
    <text x="16" y="84" class="label">ITERATION VELOCITY</text>
    <text x="16" y="101" class="desc">Copilot • Claude • Antigravity</text>
  </g>
</svg>
